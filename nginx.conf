# 배포용 화면 서버 (Docker의 ui 컨테이너). 화면 파일을 주고, /api 는 서버 컨테이너(app:8089)로 넘긴다.
server {
    listen 3009;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 내부 DNS. 주소를 요청마다 찾게 해서, 서버(app)가 아직 안 떴거나 재시작 중이어도 nginx는 뜨게 한다
    # (proxy_pass에 주소를 바로 쓰면 nginx 시작 때 app을 못 찾으면 nginx가 죽어 Cloudflare가 502를 낸다)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://app:8089;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 빌드 파일명에 해시가 붙으므로 오래 캐시해도 된다
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /calendar, /csrs 같은 화면 주소는 index.html 로 (Vue Router history 모드)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
